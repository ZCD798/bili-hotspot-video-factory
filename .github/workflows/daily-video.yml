name: Daily Bilibili hotspot video

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Local smoke test or full production (full production remains blocked until OAuth/storage/mail pass manual acceptance)"
        required: true
        type: choice
        options:
          - local-smoke
          - production
        default: local-smoke
  schedule:
    # 16:10 Asia/Shanghai == 08:10 UTC. GitHub may delay scheduled starts.
    - cron: "10 8 * * *"

permissions:
  contents: read

concurrency:
  group: daily-hotspot-video-${{ github.ref }}
  cancel-in-progress: false

jobs:
  production:
    # Daily execution is opt-in and disabled unless repository variable is explicitly set to true.
    if: github.event_name == 'workflow_dispatch' || vars.ENABLE_DAILY_PRODUCTION == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Prepare clean runner environment
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-cjk
          python -m pip install --upgrade pip
          python -m pip install -r production/requirements.txt
          python production/prepare_fonts.py
          mkdir -p runs
      - name: Static and input validation tests
        run: |
          set -euo pipefail
          bash -n production/run_production.sh
          python -m py_compile production/*.py production/tests/*.py
          python -m unittest discover -s production/tests -v
      - name: Check schedule gate and required credentials
        if: github.event_name == 'schedule'
        shell: bash
        env:
          ENABLE_DAILY_PRODUCTION: ${{ vars.ENABLE_DAILY_PRODUCTION }}
        run: |
          if [[ "${ENABLE_DAILY_PRODUCTION:-false}" != "true" ]]; then
            echo "Daily production disabled; set the repository variable only after end-to-end acceptance."
            exit 0
          fi
          echo "Gate enabled. Full production will still fail closed until an eligible editorial model and Google OAuth integration are configured."
      - name: Fetch and verify openly licensed smoke-test images
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'local-smoke'
        run: python production/fetch_licensed_assets.py --manifest production/examples/deepseek/assets_manifest.json
      - name: Produce and QA local pipeline smoke test
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'local-smoke'
        run: production/run_production.sh --story production/examples/deepseek/story.json --assets production/examples/deepseek/assets_manifest.json
      - name: Preserve local-smoke MP4 as an Actions artifact
        if: success() && github.event_name == 'workflow_dispatch' && inputs.mode == 'local-smoke'
        uses: actions/upload-artifact@v4
        with:
          name: local-smoke-video-${{ github.run_id }}
          path: runs/*/final.mp4
          if-no-files-found: error
          retention-days: 7
      - name: Run full production
        if: (github.event_name == 'workflow_dispatch' && inputs.mode == 'production') || (github.event_name == 'schedule' && vars.ENABLE_DAILY_PRODUCTION == 'true')
        shell: bash
        env:
          ENABLE_DAILY_PRODUCTION: ${{ vars.ENABLE_DAILY_PRODUCTION }}
        run: |
          echo "Full production is not enabled in this repository until story generation, eligible model auth, licensed assets, private Drive delivery and Gmail OAuth are configured."
          test "${ENABLE_DAILY_PRODUCTION:-false}" != "true" && echo "Schedule gate disabled" || true
          exit 1
      - name: Keep sanitized failure diagnostics
        if: failure()
        shell: bash
        run: |
          mkdir -p diagnostics
          printf '{"workflow":"daily-video","run_id":"%s","status":"failed","note":"Inspect action log; no media or credentials are uploaded."}\n' "$GITHUB_RUN_ID" > diagnostics/failure_summary.json
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: failure-summary-${{ github.run_id }}
          path: diagnostics/failure_summary.json
          retention-days: 7
